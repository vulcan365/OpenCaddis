name: Validate Windows Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag and main ancestry
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag '$env:GITHUB_REF_NAME' is not a semantic version tag."
          }

          git fetch origin main --no-tags
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag '$env:GITHUB_REF_NAME' is not reachable from origin/main."
          }

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install the MAUI Windows workload
        shell: pwsh
        run: dotnet workload install maui-windows --skip-manifest-update

      - name: Restore pinned packages
        shell: pwsh
        run: dotnet restore src/OpenCaddis.slnx

      - name: Test
        shell: pwsh
        run: dotnet test src/OpenCaddis.slnx -c Release --no-restore

      - name: Confirm signed release handoff
        shell: pwsh
        run: |
          Write-Host 'This workflow validates the tag only.'
          Write-Host 'Signed release assets are produced and uploaded locally with scripts/Release-Signed.ps1.'
